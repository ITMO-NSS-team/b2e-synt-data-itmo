[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "b2e-synt-data"
version = "0.1.0"
description = "Синтетический HR-корпус в форме API Heimdall для симуляции B2E-агента"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.21",
    "numpy>=1.24",
    "pytest>=9.1.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
serve = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]
dev = ["pytest>=7.4"]

[project.scripts]
b2e = "b2e.cli:main"

[tool.setuptools]
packages = ["b2e", "b2e.gen", "heimdall", "heimdall.catalog", "heimdall.engine",
            "heimdall.skills", "heimdall.store"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: uses a real socket or the wall clock. Slower, but an in-process test client would not have caught the latency-injection bug that motivated it.",
]
