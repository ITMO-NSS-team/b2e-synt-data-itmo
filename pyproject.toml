[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "b2e-synt-data"
version = "0.1.0"
description = "Синтетический HR-корпус в форме API Heimdall для симуляции B2E-агента"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.21",
    "numpy>=1.24",
    "pytest>=9.1.1",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
serve = [
    "anthropic==0.120.2",
    "arize-phoenix-otel==0.16.1",
    "fastapi==0.141.1",
    "jinja2>=3.1",
    "openinference-instrumentation-anthropic==1.1.0",
    "openinference-semantic-conventions==0.1.31",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "pyarrow>=17",
    "pydantic==2.13.4",
    "python-multipart>=0.0.9",
    "uvicorn[standard]>=0.27",
]
dev = ["pytest>=7.4"]

[project.scripts]
b2e = "b2e.cli:main"

[tool.setuptools]
packages = ["b2e", "b2e.gen", "heimdall", "heimdall.catalog", "heimdall.engine",
            "heimdall.skills", "heimdall.store"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "slow: uses a real socket or the wall clock. Slower, but an in-process test client would not have caught the latency-injection bug that motivated it.",
]
