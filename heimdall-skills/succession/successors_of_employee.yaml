name: successors_of_employee
title: Преемники конкретного сотрудника
kind: recipe
version: 1.1.0
domain: succession
order: 20
description: >
  Кто числится преемником у данного человека, в каком статусе и с какой даты
  назначения. Отвечает на «кто может меня заменить» и «кто преемник у
  руководителя такого-то».
tags: [преемник, преемники, кадровый резерв, замена, successors, скамейка, кто заменит]
rest_equivalent: true

model:
  schema: dm_core
  logic_model: employee_actual

params:
  - name: employee_id
    target: filters.value
    substitutes: "\"9877478\""
    required: true
    description: >
      Табельный номер сотрудника, чьих преемников ищем. Не ФИО — поиск по имени
      делается отдельно, через condition_like по employee_full_name.

query:
  schema: dm_core
  logic_model: employee_actual
  columns:
    - employee_id
    - employee_full_name
    - position_name
    - successors_qty
    - successors.employee_id
    - successors.full_name
    - successors.status
    - successors.appoint_date
  filters:
    type: condition
    column: employee_id
    operator: "="
    value: "9877478"
  limit: 20

output:
  - field: successors_qty
    title: Сколько преемников числится. Ноль — это ответ, а не отсутствие данных.
  - field: successors.employee_id
    title: Табельный номер преемника; по нему он ищется в employee_actual
  - field: successors.full_name
    title: Массив ФИО преемников; параллелен остальным successors.*
  - field: successors.status
    title: Статус готовности преемника
  - field: successors.appoint_date
    title: Дата назначения преемником

notes:
  - >
    Колонки successors.* — ВЛОЖЕННЫЕ: каждая приходит отдельным массивом.
    i-е элементы всех массивов относятся к одному преемнику, а длина каждого
    массива равна successors_qty. Раньше это было не так — массивы приходили
    разной длины, и рецепт велел не связывать их между собой; с пересборкой
    корпуса оговорка снята, сопоставление по индексу теперь законно.
  - >
    successors.employee_id и successors.person_id — настоящие идентификаторы:
    по ним преемник находится отдельным запросом к dm_core.employee_actual, и
    successors.full_name совпадёт с его employee_full_name. Если ответ должен
    быть проверяемым, приводите табельный номер рядом с ФИО.
  - >
    successors_qty = 0 означает, что преемников нет. Это законный ответ:
    сообщите его прямо, а не как «данных не нашлось».
  - >
    Резерв — это признак в данных, а не ваша оценка. Не выводите преемника из
    результативности или грейда, если его нет в successors.*
  - >
    Обратный вопрос — «чьим преемником числится этот человек» — это НЕ
    successors.*, а predecessor.*: та же связь с другой стороны, и только у неё
    есть predecessor.positions_name — позиция, в резерв на которую человек
    поставлен.

related:
  - {name: succession_gaps, relation: alternative, note: где преемников нет вовсе}
  - {name: rows, relation: prerequisite, note: плоские строки}
  - {name: filters, relation: prerequisite, note: как отобрать одного человека}
