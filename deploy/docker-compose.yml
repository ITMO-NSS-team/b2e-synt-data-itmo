# B2E simulation environment.
#
# Exposure rule: exactly one container publishes a host port — the reverse proxy.
# Everything else is reachable only on the internal compose networks. See
# docs/deployment.md for the exposed surface and why each opening exists.
#
# Memory limits are explicit on every service. The host has 3.8 GiB and ZERO
# swap, so an OOM is a kill rather than a slowdown; without limits the kernel
# picks the victim, and it picks badly.

name: b2e-sim

x-python-image: &python-image
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  image: b2e-sim/python:local

x-hardening: &hardening
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]
  restart: unless-stopped

networks:
  edge:            # proxy <-> public-facing services
  internal:        # service <-> service; no gateway to the outside
    internal: true

volumes:
  pgdata:
  agent_data:
  phoenix_data:
  registry_data:
  spool:
  caddy_data:
  caddy_config:

services:

  # ------------------------------------------------------------------ proxy
  proxy:
    image: caddy:2.10-alpine
    <<: *hardening
    cap_add: ["NET_BIND_SERVICE"]     # the only capability granted anywhere
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:443:443"
      - "${BIND_ADDRESS:-0.0.0.0}:80:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?set PUBLIC_HOST in .env}
      # Имя для соединений без SNI — то есть для всех, кто пришёл по IP.
      # Обычно совпадает с публичным адресом; см. комментарий в Caddyfile.
      DEFAULT_SNI: ${DEFAULT_SNI:?set DEFAULT_SNI in .env (usually the public address)}
      BASIC_AUTH_HASH: ${BASIC_AUTH_HASH:?run `make hash-password` and set it in .env}
      # `internal` for an IP-only host (Caddy mints its own certificate), or an
      # ACME email address when PUBLIC_HOST is a real DNS name.
      TLS_MODE: ${TLS_MODE:-internal}
      # base64("user:password") for the admin UI's own Basic auth. The proxy is
      # the only holder; see the /admin block in the Caddyfile for why.
      ADMIN_BASIC: ${ADMIN_BASIC:?run scripts/make_admin_basic.sh and set it in .env}
    networks: [edge]
    mem_limit: 96m
    depends_on: [research-api, admin-ui, phoenix, b2e-agent]

  # ------------------------------------------------------------- observability
  postgres:
    image: postgres:16-alpine
    <<: *hardening
    # Start directly as the postgres user. The default entrypoint starts as root
    # and drops privileges, which needs CHOWN/FOWNER/SETUID/SETGID — capabilities
    # `cap_drop: ALL` has already removed, so it fails with
    # "error: failed switching to 'postgres': operation not permitted".
    # Starting as the right user skips that step entirely, which is strictly
    # better than granting the capabilities back.
    user: "70:70"
    environment:
      POSTGRES_USER: phoenix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: phoenix
    volumes: [pgdata:/var/lib/postgresql/data]
    networks: [internal]
    # Tuned small on purpose: the default assumes a machine that is not this one.
    command: >
      postgres -c shared_buffers=96MB -c max_connections=32
               -c effective_cache_size=256MB -c work_mem=4MB
    mem_limit: 320m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phoenix"]
      interval: 10s
      timeout: 5s
      retries: 10

  phoenix:
    # Pinned to a tag that exists — verified against the registry, not guessed.
    # The -nonroot variant so this service matches the claim in docs/deployment.md
    # that no container runs as root.
    image: arizephoenix/phoenix:version-19.13.0-nonroot
    <<: *hardening
    environment:
      PHOENIX_SQL_DATABASE_URL: postgresql://phoenix:${POSTGRES_PASSWORD}@postgres:5432/phoenix
      PHOENIX_WORKING_DIR: /phoenix
      PHOENIX_ENABLE_AUTH: "false"     # auth is enforced at the proxy
    volumes: [phoenix_data:/phoenix]
    networks: [edge, internal]
    # Measured at ~500 MiB idle with a handful of spans, which was 78% of an
    # earlier 640m limit. On a box with zero swap that margin is too thin: an
    # OOM is a kill, and Phoenix holds the traces every comparison depends on.
    mem_limit: 832m
    depends_on:
      postgres: {condition: service_healthy}

  # --------------------------------------------------------------- emulator
  heimdall-emulator:
    <<: [*python-image, *hardening]
    command: >
      uvicorn --factory sim.emulator.app:create_app
              --host 0.0.0.0 --port 8081 --workers 1
    environment:
      HEIMDALL_SNAPSHOT_ON: /data/snapshot
      HEIMDALL_SNAPSHOT_OFF: /data/snapshot-notraps
      HEIMDALL_CATALOG: /app/catalog/snapshot.json
      HEIMDALL_SKILLS: /app/heimdall-skills
      HEIMDALL_TRAPS_ENABLED: ${TRAPS_ENABLED:-true}
      HEIMDALL_LATENCY_PROFILE: ${LATENCY_PROFILE:-realistic}
      HEIMDALL_ENABLE_DEV_ROUTER: "false"   # see docs/skill-execution-threat-model.md §1.1
      HEIMDALL_HR_EMPLOYEE_IDS: ${HR_EMPLOYEE_IDS:-}
      HEIMDALL_QUERY_BUDGET_BYTES: ${QUERY_BUDGET_BYTES:-4294967296}
    volumes:
      - ${DATA_DIR:-../data-small}:/data/snapshot:ro
      - ${DATA_DIR_NOTRAPS:-../data-small}:/data/snapshot-notraps:ro
      - ../heimdall-skills:/app/heimdall-skills:ro
    networks: [internal]
    # Должен быть выше HEIMDALL_QUERY_BUDGET_BYTES, иначе cgroup убьёт контейнер
    # раньше, чем сработает гейт, и вместо ошибки запроса получится потерянный
    # прогон. 4 ГиБ бюджета + запас на интерпретатор и кэш читателя.
    # См. docs/query-budget.md.
    mem_limit: 5g
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8081/control/healthz',timeout=5).status==200 else 1)\""]
      interval: 15s
      timeout: 8s
      retries: 8
      start_period: 40s

  # ------------------------------------------------------------ proxy relay
  #
  # Anthropic is reachable from this host only through a local xray proxy bound
  # to 127.0.0.1, which a container cannot use — a container's loopback is its
  # own. This relay runs in the host network namespace so it *can* reach that
  # loopback, and republishes it on the compose network's gateway address.
  #
  # Bound to the gateway specifically, never 0.0.0.0. On a host with a public IP
  # an open forward proxy on all interfaces is an abuse vector that would be
  # found by scanners within hours.
  proxy-relay:
    image: alpine/socat:latest
    <<: *hardening
    network_mode: host
    command: >
      TCP-LISTEN:${RELAY_PORT:-10810},bind=${RELAY_BIND:-172.20.0.1},fork,reuseaddr
      TCP:127.0.0.1:${HOST_PROXY_PORT:-10809}
    mem_limit: 32m
    profiles: ["relay"]

  # ------------------------------------------------------------------ agent
  b2e-agent:
    <<: *hardening
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      # Carries the Claude Code CLI and the skill runner; the other services
      # stay on the smaller base image.
      target: agent
    image: b2e-sim/agent:local
    # The host reaches Anthropic through a local xray proxy. A container cannot
    # use the host's 127.0.0.1, so the proxy is addressed via the gateway.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: >
      uvicorn --factory sim.agent.app:create_app
              --host 0.0.0.0 --port 8082 --workers 1
    environment:
      HEIMDALL_URL: http://heimdall-emulator:8081
      HEIMDALL_TOKEN: ${HEIMDALL_TOKEN:-sim-technical-account}
      B2E_LLM_MODE: ${B2E_LLM_MODE:-replay}
      B2E_CASSETTES: /app/cassettes
      B2E_REGISTRY_DB: /app/registry/registry.db
      B2E_AGENT_DB: /app/var/agent.db
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:6006
      PHOENIX_PROJECT: ${PHOENIX_PROJECT:-b2e-sim}
      # Read from the environment only. Never written to a file or a commit.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # claude_code (default) drives a headless `claude -p` session, which is
      # what the subscription token is scoped to. messages_api keeps the
      # deterministic loop for replay and CI.
      B2E_HARNESS: ${B2E_HARNESS:-claude_code}
      B2E_CLAUDE_BIN: claude
      B2E_SKILL_RUNNER: /opt/skills/run
      B2E_MCP_BRIDGE: /app/heimdall/bridge.py
      # Resumable sessions live on the agent's volume, not in the image layer,
      # so a conversation survives `up --build`. The CLI files transcripts per
      # (HOME, project dir) and needs both stable to resume.
      B2E_SESSION_ROOT: /app/var/sessions
      B2E_CLAUDE_HOME: /app/var/claude-home
      # The proxy publishes this service under /agent and strips the prefix.
      # FastAPI needs to be told, or the Swagger page it serves asks the browser
      # for /openapi.json — an absolute URL that never reaches this app.
      B2E_ROOT_PATH: /agent
      # Egress to Anthropic goes through the host's proxy. NO_PROXY must list
      # every internal name, or Heimdall and Phoenix calls would be tunnelled
      # out to the internet and fail.
      HTTP_PROXY: ${AGENT_HTTP_PROXY:-http://host.docker.internal:10809}
      HTTPS_PROXY: ${AGENT_HTTP_PROXY:-http://host.docker.internal:10809}
      NO_PROXY: localhost,127.0.0.1,::1,heimdall-emulator,phoenix,postgres,research-api,admin-ui,host.docker.internal
    volumes:
      # The approval store is READ-ONLY here. The threat model says the agent
      # uid cannot write it; mounting it rw made that false, and in the
      # code-execution arm one UPDATE self-approves every draft.
      - registry_data:/app/registry:ro
      - agent_data:/app/var
      - ../cassettes:/app/cassettes
      - spool:/spool
    networks: [edge, internal]
    mem_limit: 384m
    depends_on:
      heimdall-emulator: {condition: service_healthy}

  # ----------------------------------------------------------- research API
  research-api:
    <<: [*python-image, *hardening]
    command: >
      uvicorn --factory sim.research.app:create_app
              --host 0.0.0.0 --port 8083 --workers 1
    environment:
      B2E_AGENT_URL: http://b2e-agent:8082
      PHOENIX_URL: http://phoenix:6006
      PHOENIX_PROJECT: ${PHOENIX_PROJECT:-b2e-sim}
      # Published under /research with the prefix stripped; same reason as the
      # agent above.
      B2E_ROOT_PATH: /research
    networks: [edge, internal]
    mem_limit: 256m
    depends_on: [b2e-agent, phoenix]

  # --------------------------------------------------------------- admin UI
  admin-ui:
    <<: [*python-image, *hardening]
    command: >
      uvicorn --factory sim.admin.app:create_app
              --host 0.0.0.0 --port 8084 --workers 1
    environment:
      B2E_REGISTRY_DB: /app/registry/registry.db
      HEIMDALL_URL: http://heimdall-emulator:8081
      B2E_AGENT_URL: http://b2e-agent:8082
      # Deep links for the browser. Separate from PUBLIC_HOST because that may
      # be a bare site address like ":443", which is not a URL.
      PHOENIX_PUBLIC_URL: ${PUBLIC_URL:-https://localhost}/phoenix
      ADMIN_USER: ${ADMIN_USER:?set ADMIN_USER in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
    volumes: [registry_data:/app/registry]
    networks: [edge, internal]
    mem_limit: 192m
    depends_on: [b2e-agent]

  # ----------------------------------------------------------- skill sandbox
  # spool-init exists because named volumes are created root:root and uid 10001
  # cannot otherwise write them. Ordering here was a real bug found in testing.
  spool-init:
    image: busybox:1.36
    command: sh -c "mkdir -p /spool/new /spool/run /spool/out && chown -R 10001:10001 /spool && chmod 0770 /spool/new /spool/run /spool/out"
    volumes: [spool:/spool]
    user: "0:0"
    restart: "no"
    networks: []

  sandbox-worker:
    <<: [*python-image, *hardening]
    command: python -m sim.sandbox.worker
    environment:
      SANDBOX_SPOOL: /spool
    volumes:
      - spool:/spool
    # The executing side has NO network at all. It reaches the rest of the system
    # only through the spool volume, which is what makes network_mode:none
    # possible without giving any service a Docker socket.
    network_mode: none
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,nodev,size=64m,mode=1777
    pids_limit: 64
    mem_limit: 320m
    memswap_limit: 320m
    cpus: 0.5
    depends_on:
      spool-init: {condition: service_completed_successfully}

  # ------------------------------------------------------------- telegram
  # Outbound only, by long polling. A webhook would need another hole in the
  # proxy for Telegram to call; polling adds no exposed surface at all.
  telegram-bot:
    <<: [*python-image, *hardening]
    command: python -m sim.telegram_bot
    # api.telegram.org is only reachable from this host through the same proxy
    # Anthropic needs. Without this the bot polls forever and answers nobody,
    # which is indistinguishable from the bot not being deployed at all.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      B2E_AGENT_URL: http://b2e-agent:8082
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:?set TELEGRAM_BOT_TOKEN in .env}
      TELEGRAM_DEFAULT_EMPLOYEE: ${TELEGRAM_DEFAULT_EMPLOYEE:?set TELEGRAM_DEFAULT_EMPLOYEE in .env}
      # A chat is a conversation: this config ships with conversation_mode=
      # "resume", so consecutive messages share one Claude Code session.
      # Point it at `agent_config` to get the stateless batch behaviour instead.
      B2E_TELEGRAM_CONFIG_REF: ${B2E_TELEGRAM_CONFIG_REF:-agent_config_interactive}
      HTTP_PROXY: ${AGENT_HTTP_PROXY:-http://172.20.0.1:10810}
      HTTPS_PROXY: ${AGENT_HTTP_PROXY:-http://172.20.0.1:10810}
      NO_PROXY: localhost,127.0.0.1,::1,b2e-agent,heimdall-emulator,phoenix
    networks: [edge, internal]
    mem_limit: 128m
    # NOTE: profile "telegram" means `make up` does NOT start this. Use
    # `make up PROFILE=telegram`, or the bot silently does not exist.
    profiles: ["telegram"]
    depends_on: [b2e-agent]
